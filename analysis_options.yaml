include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Generated by build_runner. Never edited by hand, so never linted.
    - "**/*.g.dart"
  errors:
    # A ledger that silently ignores a failed write is worse than one that
    # crashes, so unawaited futures are an error here rather than a hint.
    unawaited_futures: error

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_final_locals
    - unnecessary_await_in_return
