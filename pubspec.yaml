name: ghar_saheli
description: "Ghar Hisaab — household ledger for Pakistani homes. Offline-first, no accounts, no cloud."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # Local database. drift = type-safe SQL over SQLite with reactive queries.
  drift: ^2.20.0
  # Ships a modern SQLite binary with the APK instead of trusting the one
  # baked into old Android builds — budget phones often carry ancient versions.
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  # SHA-256 for the PIN. Dart has no hashing in core, and a stored PIN must
  # never be plaintext. Official Dart team package, a few tens of kilobytes.
  crypto: ^3.0.5
  # Salary receipts. `pdf` builds the document in pure Dart; `share_plus`
  # hands the finished file to WhatsApp through Android's own share sheet,
  # so the app never needs contacts, network, or a WhatsApp integration.
  pdf: ^3.11.0
  share_plus: ^10.0.0
  # Encrypted backups. AES-GCM is authenticated, so a corrupted or tampered
  # backup fails loudly instead of restoring silent nonsense into a ledger.
  encrypt: ^5.0.3
  # Choosing a backup file to restore from. Android has no way to hand a file
  # to an app without going through the system picker.
  file_picker: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.13
  # Generates every launcher icon size Android needs from one source image.
  # Build-time only — nothing from this package ships inside the APK.
  flutter_launcher_icons: ^0.14.1

# Run after changing assets/icon/*:
#   dart run flutter_launcher_icons
#
# Two source images, because Android has two icon systems. The square one is
# the legacy icon, used as-is on Android 7 and older. The adaptive pair is for
# Android 8+, where the launcher masks the icon into whatever shape the phone's
# theme uses — circle, squircle, rounded square — and animates it. Only the
# centre of an adaptive foreground is guaranteed visible, so the book in
# icon_foreground.png is scaled smaller than in icon.png to survive a circular
# crop with room to spare.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FDF7EB"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  # Android 13+ themed icons: the launcher tints this layer to match the
  # user's wallpaper, reading shape from its alpha channel only. Derived from
  # the artwork's luminance so the book's ink stays solid and the cream page
  # drops out — a flat silhouette would just be a featureless blob.
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
